<!DOCTYPE html>
<html dir="ltr" lang="ru">

<head>

  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <meta
    name="description"
    content="Технические работы"
  >

  <title>
    Приватность, Анонимность, Безопасность.
  </title>

  <link
    rel="icon"
    href="favicon.svg"
  >

  <link
    rel="preconnect"
    href="https://fonts.googleapis.com"
  >

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
    rel="stylesheet"
  >

  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {

      font-family: "Manrope", sans-serif;

      background: #0d0d0d;

      color: white;

      min-height: 100vh;

      display: flex;

      justify-content: center;

      align-items: center;

      text-align: center;

      padding: 24px;

    }

    .container {

      width: 100%;
      max-width: 700px;

    }

    .logo {

      width: 140px;

      margin-bottom: 40px;

      opacity: 0.95;

    }

    h1 {

      font-size: 42px;

      line-height: 1.15;

      font-weight: 800;

      margin-bottom: 24px;

      letter-spacing: -0.04em;

    }

    p {

      font-size: 20px;

      line-height: 1.7;

      color: rgba(255,255,255,.75);

    }

    .badge {

      display: inline-block;

      margin-top: 32px;

      padding: 10px 18px;

      border-radius: 999px;

      background: rgba(255,255,255,.08);

      color: rgba(255,255,255,.85);

      font-size: 14px;

      letter-spacing: .02em;

    }

    @media (max-width: 768px) {

      h1 {
        font-size: 32px;
      }

      p {
        font-size: 17px;
      }

      .logo {
        width: 110px;
      }

    }

  </style>

</head>

<body>

  <div class="container">

    <img
      src="logo.png"
      alt="Logo"
      class="logo"
    >

    <h1>
      Идут технические работы
    </h1>

    <p>
      Скоро сервис будет работать в обычном порядке.
      <br><br>
      Все данные в сохранности.
      <br><br>
      Приносим извинения за неудобства.
      <br><br>
      Скоро ещё больше функционала!
    </p>

    <div class="badge">
      Мы скоро вернёмся 🚀
    </div>

  </div>

</body>

</html>
